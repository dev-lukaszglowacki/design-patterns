<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design Pattern Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            padding-top: 4.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Design Patterns</a>
        </div>
    </nav>

    <main class="container">
        <div class="px-4 py-5 my-5 text-center">
            <h1 class="display-5 fw-bold"><span id="title">Design Pattern Tester</span></h1>
            <div class="col-lg-6 mx-auto">
                <p class="lead mb-4">Click a button to see an example of a design pattern in action.</p>
                <div id="patterns" class="d-flex flex-wrap justify-content-center"></div>
            </div>
        </div>

        <div>
            <h2>Result:</h2>
            <pre id="result" class="p-3 bg-light border rounded-3">Select a pattern to see the result.</pre>
        </div>
    </main>

    <script>
        const patternsDiv = document.getElementById('patterns');
        const resultDiv = document.getElementById('result');

        fetch('/api/patterns')
            .then(response => response.json())
            .then(patterns => {
                for (const pattern in patterns) {
                    const button = document.createElement('button');
                    button.textContent = pattern;
                    button.className = 'btn btn-primary btn-lg px-4 gap-3 m-2';
                    button.onclick = () => testPattern(patterns[pattern]);
                    patternsDiv.appendChild(button);
                }
            });

        function testPattern(url) {
            resultDiv.textContent = 'Loading...';
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    resultDiv.textContent = data;
                })
                .catch(error => {
                    resultDiv.textContent = 'Error: ' + error;
                });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
